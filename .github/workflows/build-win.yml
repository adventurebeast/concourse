name: Build (Windows)

# Produce a real .exe installer on a native Windows runner so node-pty (ConPTY)
# and the llama.cpp runtime are compiled for Windows — no wine, no cross-compile.
# A hand-triggered run only uploads the installer as a build artifact; a vX.Y.Z
# tag build ALSO attaches it to that tag's GitHub Release, so the Releases page
# serves Windows alongside the DMG. (npm run release creates the release + tag
# from the Mac; this workflow completes it a few minutes later.)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed by the attach step: GITHUB_TOKEN must be allowed to edit releases.
permissions:
  contents: write

jobs:
  build:
    # Pin to VS 2022, NOT windows-latest: latest now maps to the win25-vs2026 image,
    # whose Visual Studio 2026 the node-gyp bundled in electron-rebuild can't detect
    # ("unknown version undefined") — node-pty's native rebuild then fails. windows-2022
    # ships VS 2022, which node-gyp resolves cleanly. Revisit when node-gyp learns VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Full install (NOT --ignore-scripts): the postinstall electron-rebuild compiles
      # node-pty against this Electron for Windows/x64.
      - name: Install
        run: npm ci
      # Vendor the Windows llama.cpp runtime (llama-server.exe + .dll siblings) into
      # build/bin. Non-fatal if it fails — the app just ships without bundled Pulse.
      - name: Vendor llama runtime
        run: npm run fetch:llama
      - name: Build renderer/main
        run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --win --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: concourse-windows-x64
          path: release/*.exe
          if-no-files-found: error
      # Tag builds: attach the installer to the matching GitHub Release. --clobber
      # makes re-runs safe (same file name replaces the old asset). If the tag was
      # pushed without a release (raw git tag), this fails visibly rather than
      # silently shipping nothing — create the release first (npm run release).
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
